description: |
   Alice and Bob are exchanging secret messages using elliptic curve cryptography (ECC). You have intercepted their public keys and, surprisingly, Bob's private key. Your task is to compute the shared secret and decrypt the flag.
   - The elliptic curve used in this challenge is brainpoolP256r1.

