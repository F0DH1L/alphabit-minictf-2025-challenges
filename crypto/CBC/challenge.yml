name: "CBC?"

category: "crypto"

author: "Senhadji M Said"
author_link: https://github.com/SenhadjiMSaid

description: |
  We've encrypted a message using AES encryption, and we think it's AES-CBC.
  But something feels off... Can you decrypt the message and uncover the truth? 

  > [cbc_challenge.txt](https://drive.google.com/file/d/1rxvdgQLS7wZ8qk2gWDIS5T_GUesZTFpo/view?usp=drive_link)
  >  **Author** : Senhadji M Said

flags:
  - Alphabit{it_was_ECB_all_along}


hints:
  - "Look for identical ciphertext blocks."
  - "CBC mode uses XOR between plaintext and the previous ciphertext block (or IV for the first block)."
  - "Identical plaintext blocks may reveal something..."

